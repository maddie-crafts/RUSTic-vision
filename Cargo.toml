[package]
name = "rustic_vision"
version = "0.1.0"
edition = "2024"

[dependencies]
# Shared dependencies
image = "0.24"
clap = { version = "4.4", features = ["derive"] }

# Only for web (WASM)
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
console_log = "1.0"
console_error_panic_hook = "0.1"
gloo = { version = "0.10", features = ["file"] }
log = "0.4"
web-sys = { version = "0.3", features = [
  "FileReader",
  "HtmlInputElement",
  "Event",
  "Blob",
  "DomException",
  "console",
  "HtmlFormElement",
  "HtmlInputElement",    
  "FileList",           
  "File",             
] }
js-sys = "0.3"

# Optional: for feature-flag split
cfg-if = "1.0"

[features]
default = ["cli"]
cli = []
web = []

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "rustic_vision"